version: "2"

linters:
  disable:
    - errcheck      # Temporarily disabled - too many unchecked errors
    - gosec         # Temporarily disabled - G104 exclusions not working
  enable:
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis (includes gosimple checks in v2)
    - unused        # Check for unused code
    - misspell      # Spell checker
    - revive        # Fast, configurable linter
  settings:
    govet:
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: false
        - name: var-naming
          disabled: false
        - name: package-comments
          disabled: true  # Not enforcing package comments for now
  exclusions:
    rules:
      # Ignore deprecation warnings for go-ping/ping dependency until it's replaced
      - linters:
          - staticcheck
        text: "github.com/go-ping/ping.*is deprecated"
      # Ignore fieldalignment - premature optimization for a CLI tool
      - linters:
          - govet
        text: "fieldalignment:"
      # Ignore shadow warnings in tests
      - linters:
          - govet
        text: "shadow:"
        path: "_test\\.go"
      # Ignore unusedwrite in test fixtures
      - linters:
          - govet
        text: "unusedwrite:"
        path: "_test\\.go"
      # Relax error checking in test files
      - linters:
          - errcheck
        path: "_test\\.go"
      # Relax gosec error checking in test files
      - linters:
          - gosec
        text: "G104:"
        path: "_test\\.go"
      # Ignore G104 for output.Print - output formatting errors are not critical
      - linters:
          - gosec
        text: "output.Print"

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
